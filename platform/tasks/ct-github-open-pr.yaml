apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ct-github-open-pr
  namespace: openshift-pipelines
spec:
  params:
    - name: image-tag
      type: string
    - name: github-owner
      type: string
    - name: github-repo
      type: string
    - name: deployment-file
      type: string
    - name: app-name
      type: string
    - name: branch
      type: string
  steps:
    - computeResources: {}
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-auth-secret
      image: 'docker.io/alpine:latest'
      name: update-and-pr
      script: |
        #!/bin/sh
        set -e

        echo "Instalando dependencias (git, curl, yq)..."
        apk add --no-cache bash git curl yq

        OWNER="$(params.github-owner)"
        REPO="$(params.github-repo)"
        TAG="$(params.image-tag)"
        FILE="$(params.deployment-file)"
        APP_NAME="$(params.app-name)"
        BRANCH_NAME="update-image-$TAG"

        echo "Cloning GitOps repo..."
        git clone https://${GITHUB_TOKEN}@github.com/${OWNER}/${REPO}.git repo-gitops
        cd repo-gitops

        git checkout -b $BRANCH_NAME

        echo "Updating deployment YAML..."
        # Updated yq command to only target the Deployment document
        yq e '(select(.kind == "Deployment").spec.template.spec.containers[] | select(.name == "'$APP_NAME'")).image = "image-registry.openshift-image-registry.svc:5000/'$(context.taskRun.namespace)'/'$APP_NAME':'$TAG'"' -i $FILE

        git config user.email "tekton@ast.aragon.es"
        git config user.name "Tekton Pipeline"
        git add $FILE
        git commit -m "Auto: Update deployment to version $TAG"
        git push origin $BRANCH_NAME

        echo "Opening Pull Request..."
        curl -s -o /dev/null -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${OWNER}/${REPO}/pulls \
          -d '{
            "title": "Update App to version '"$TAG"'",
            "body": "Automated PR from Tekton Pipeline.",
            "head": "'"$BRANCH_NAME"'",
            "base": "$(params.branch)"
          }'
      workingDir: $(workspaces.source.path)
  workspaces:
    - name: source
